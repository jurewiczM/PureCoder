name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is model-independent by design: validators, the executor,
      # the test gate and the chunkers run without llama-server or a GPU.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check purecoder tests examples

      - name: Test
        run: pytest -q
