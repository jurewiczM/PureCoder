name: tests

# The old trigger was `push: branches: [main]` plus `pull_request`. With the
# work happening on a feature branch and no PR open, neither fired -- 48
# commits landed without CI running once. Any branch push now runs it.
#
# `push` and `pull_request` both firing means a same-repo PR is built twice.
# That is accepted rather than overlooked: dropping `pull_request` would leave
# fork PRs unbuilt, and the branch push is what makes CI useful day to day.
on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The suite is model-independent by design: validators, the executor,
      # the test gate and the chunkers run without llama-server or a GPU.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check purecoder tests examples

      # This job answers "does the package work on this Python", and it is
      # allowed to skip a language whose toolchain the runner lacks -- the
      # `toolchains` job below is what proves the languages themselves.
      #
      # The ad-hoc "toolchains present" gate that used to live here is gone. It
      # listed g++, node, rustc and ocamlc and NOT dotnet, so C# was the one
      # language it could not have caught leaving -- exactly the hole it was
      # written to close. `account()` derives the binary from each language's
      # own argv instead, so the list cannot go stale.
      #
      # -rs lists every skip with its reason, so a skip is visible in the log
      # rather than hidden behind a dot.
      - name: Test
        run: pytest -q -rs

  package:
    # Grammars ship as package data. An editable install resolves them from the
    # source tree either way, so a broken package-data declaration is invisible
    # to the test job above and only surfaces for someone who pip-installs it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install it where the source tree is not
        run: |
          set -eu
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          # Compared against the source tree, not a hardcoded list: naming the
          # grammars here would assert a future state, and the check would fail
          # on any commit predating the newest one.
          EXPECTED=$(ls purecoder/grammars/*.gbnf | xargs -n1 basename | sort | tr '\n' ' ')
          cd /tmp
          EXPECTED="$EXPECTED" /tmp/clean/bin/python - <<'PY'
          import os
          from pathlib import Path

          from purecoder.client import GRAMMARS_DIR

          expected = set(os.environ["EXPECTED"].split())
          shipped = {p.name for p in Path(GRAMMARS_DIR).glob("*.gbnf")}
          print("in the source tree:", sorted(expected))
          print("in the wheel      :", sorted(shipped))
          missing = expected - shipped
          assert not missing, f"not packaged: {sorted(missing)}"
          PY
          /tmp/clean/bin/purecoder --help >/dev/null
          echo "console script runs"

  toolchains:
    # The suite where nothing is allowed to skip.
    #
    # A green run on a machine missing `ocamlc` proves less than it looks, and
    # for weeks that caveat was written down and enforced by nothing. Here the
    # image supplies every toolchain the registry can run, and
    # PURECODER_REQUIRE_ALL_LANGUAGES=1 turns the skip report into an
    # assertion: if a language this image promises is missing, the build
    # published something broken and this is where it surfaces.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built here rather than pulled: no registry, no credentials, and the
      # Dockerfile in this commit is what gets tested. The layer cache makes a
      # repeat run cheap; the first one pays for dotnet and the apt set.
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: purecoder-toolchains:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `chunking` as well as `dev`: without tree-sitter those tests skip, and
      # this is the job that is not allowed to skip. `rag` is deliberately left
      # out -- it pulls ~2 GB of torch for tests that already degrade honestly.
      # Piped in with `git archive` rather than bind-mounted. Three reasons,
      # and the last one is the one that bit: only TRACKED files go in, so the
      # image tests the commit rather than the working tree; no mount means no
      # uid mismatch between the checkout and the image's non-root user; and a
      # bind mount plus `cp -r` fails outright on any file the container user
      # cannot read. Locally that was a 0700 scratch directory, and the job
      # would have passed in CI purely because that file is not checked in --
      # an environment assumption, in the change that exists to remove them.
      - name: The whole suite, with nothing allowed to skip
        run: |
          git archive HEAD --prefix=repo/ | docker run --rm -i \
            -e PURECODER_REQUIRE_ALL_LANGUAGES=1 \
            purecoder-toolchains:ci sh -c '
              set -eu
              cd /tmp && tar x && cd repo
              python3 -m venv /tmp/v
              /tmp/v/bin/pip install -q -e ".[dev,chunking]"
              /tmp/v/bin/pytest -q -rs
            '
